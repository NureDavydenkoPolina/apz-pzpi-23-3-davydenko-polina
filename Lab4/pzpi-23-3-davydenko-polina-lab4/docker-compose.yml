services:
  backend1:
    build: ./SmartFoodBackend
    container_name: smartfood_backend1
    ports:
      - "5001:5000"

    command: ["flask", "--app", "app:app", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

    environment:
      SQLALCHEMY_DATABASE_URI: "mssql+pyodbc://sf_user:12345678@host.docker.internal:1433/SmartFood?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes"
      JWT_SECRET_KEY: "dev-secret"

  backend2:
    build: ./SmartFoodBackend
    container_name: smartfood_backend2
    ports:
      - "5002:5000"

    command: ["flask", "--app", "app:app", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

    environment:
      SQLALCHEMY_DATABASE_URI: "mssql+pyodbc://sf_user:12345678@host.docker.internal:1433/SmartFood?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes"
      JWT_SECRET_KEY: "dev-secret"

  backend3:
    build: ./SmartFoodBackend
    container_name: smartfood_backend3
    ports:
      - "5003:5000"

    command: ["flask", "--app", "app:app", "run", "--host=0.0.0.0", "--port=5000", "--debug"]

    environment:
      SQLALCHEMY_DATABASE_URI: "mssql+pyodbc://sf_user:12345678@host.docker.internal:1433/SmartFood?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=no&TrustServerCertificate=yes"
      JWT_SECRET_KEY: "dev-secret"

  nginx:
    image: nginx:latest
    container_name: smartfood_nginx

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

    depends_on:
      - backend1
      - backend2
      - backend3